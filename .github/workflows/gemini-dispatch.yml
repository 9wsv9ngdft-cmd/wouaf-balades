
name: Gemini Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  gemini:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Tu es l'assistant développeur du projet Wouaf Balades.

            Analyse le dépôt et comprends son architecture.
            Étudie attentivement la demande ci-dessous.

            IMPORTANT :
            - Tu es en mode ANALYSE UNIQUEMENT.
            - Ne crée, ne supprime et ne modifie aucun fichier.
            - Ne lance aucune commande qui modifie le projet.
            - Ne publie aucun changement.
            - Fournis un diagnostic et un plan détaillé.
            - Indique les fichiers qui seraient concernés.

            Demande :
            ${{ github.event.comment.body }}
